<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>POLICE_DASHBOARD</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            background-color: #d5e1e8;
        }

        header {
            background-color: #01414c;
            color: white;
            padding: 10px 0;
            text-align: center;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1000px;
            margin: auto;
            padding: 0 20px;
        }

        .header-img {
            width: 100px;
            height: auto;
        }

        h1 {
            font-family: 'Times New Roman';
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-transform: uppercase;
        }

       .logout-bar {
    background-color: rgba(255, 255, 255, 0.9);
    text-align: right;
    padding: 8px 20px;
}

.logout-link {
    background-color: #e63946;
    color: white;
    text-decoration: none;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 14px;
    transition: background-color 0.3s;
}

.logout-link:hover {
    background-color: #c91f2e;
}

        .home {
            background-color: #1c4a53;
            color: white;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 14px;
            transition: background-color 0.3s;
        }

        .home:hover {
            background-color: #127d9a;
        }

        .main-layout {
            display: flex;
            flex: 1;
        }

      .sidebar {
            width: 250px;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 30px 20px;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
        }

        .sidebar h2 {
            margin-bottom: 20px;
            color: #01414c;
        }

        .sidebar a {
            margin: 10px 0;
            padding: 12px;
            font-size: 16px;
            background-color: #01414c;
            color: white;
            text-align: center;
            border-radius: 6px;
            text-decoration: none;
            transition: background-color 0.3s;
        }

        .sidebar a:hover {
            background-color: #036876;
        }

    .content-area {
    flex: 1;
    display: flex;
    width: 100%;
    height: 100%;
    align-items: center;
    justify-content: center;

    background-image: url('/images/policeBG.jpeg'); /* Thymeleaf can also be used */
    background-size: cover;    /* make it fill */
    background-position: center;
    background-repeat: no-repeat;
}
        footer {
            background-color: #01414c;
            color: white;
            text-align: center;
            padding: 15px 0;
            margin-top: auto;
        }
    </style>
</head>
<body>

<header>
    <div class="header-container">
        <h1>CRIME REPORTING SYSTEM</h1>
        <img th:src="@{/images/logo.jpg}" alt="Logo" class="header-img">
    </div>
</header>

<div class="logout-bar">
    <a th:href="@{/login}" class="logout-link">Logout</a>
    <a th:href="@{/}" class="home">Home</a>
</div>


<div class="main-layout">
    <aside class="sidebar">
        <h2>Police Dashboard</h2>
        <a th:href="@{/report/all}">View Reports</a>
        <a th:href="@{/chcid}">Update Reports</a>
    </aside>

    <section class="content-area">
        <img th:src="@{/images/policeBG.jpeg}" alt="bg" class="header-img">
    </section>
</div>

<footer> &copy; 2025 Samiha. All rights reserved. </footer>

</body>
</html>
