<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Update Report - Police Dashboard</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #d5e1e8;
        }

        header {
            background-color: #01414c;
            color: white;
            padding: 15px 0;
            text-align: center;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1100px;
            margin: auto;
            padding: 0 20px;
        }

        .header-img {
            width: 90px;
            height: auto;
        }

        h1 {
            font-size: 22px;
            text-transform: uppercase;
        }

        .logout-bar {
            background-color: #d5e1e8;
            text-align: right;
            padding: 8px 20px;
        }

        .logout-link {
            background-color: #e63946;
            color: white;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 14px;
            transition: background-color 0.3s;
        }

        .logout-link:hover {
            background-color: #c91f2e;
        }

        .home {
            background-color: #1c4a53;
            color: white;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 14px;
            transition: background-color 0.3s;
        }

        .home:hover {
            background-color: #127d9a;
        }

        .content {
            flex: 1;
            padding: 30px;
            max-width: 700px;
            margin: auto;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.1);
        }

        .content h2 {
            margin-bottom: 20px;
            color: #01414c;
            text-align: center;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }

        input[type="text"],
        input[type="date"],
        textarea,
        select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        textarea {
            height: 100px;
        }

        .submit-btn {
            background-color: #01414c;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-size: 15px;
        }

        .submit-btn:hover {
            background-color: #036876;
        }

        footer {
            background-color: #01414c;
            color: white;
            text-align: center;
            padding: 15px 0;
            margin-top: auto;
        }
    </style>
</head>
<body>

<header>
    <div class="header-container">
        <h1>CRIME REPORTING SYSTEM</h1>
        <img th:src="@{/images/logo.jpg}" alt="Logo" class="header-img">
    </div>
</header>

<div class="logout-bar">
    <a th:href="@{/login}" class="logout-link">Logout</a>
    <a th:href="@{/}" class="home">Home</a>
</div>

<div class="content">
    <h2>Update Report Details</h2>
    <form th:action="@{/report/update/{id}(id=${report.id})}" th:object="${report}" method="post">

        <label for="id">Report ID</label>
        <input type="text" id="id" th:field="*{id}" readonly>

        <label for="title">Report Title</label>
        <input type="text" id="title" th:field="*{title}" readonly>

        <label for="citizenName">Citizen Name</label>
        <input type="text" id="citizenName" th:field="*{user.name}" readonly>

        <label for="description">Description</label>
        <textarea id="description" th:field="*{description}" readonly></textarea>

        <label for="status">Status</label>
        <select id="status" th:field="*{status}">
            <option value="Pending">Pending</option>
            <option value="Under Investigation">Under Investigation</option>
            <option value="Resolved">Resolved</option>
        </select>

        <label for="remarks">Remarks</label>
        <textarea id="remarks" th:field="*{remarks}" placeholder="Enter police remarks..."></textarea>

        <button type="submit" class="submit-btn">Update Report</button>
    </form>
</div>

<footer>&copy; 2025 Samiha. All rights reserved.</footer>

</body>
</html>
