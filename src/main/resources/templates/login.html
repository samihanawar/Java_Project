<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Login</title></head>


<style>
    body {
       // background-image: url('/images/bgpic.jpg');
        background-size: cover;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
    }
    header {
        background-color: #01414c;
        color: white;
        padding: 5px;
        text-align: center;
        font-size: 15px;
        width: 100%;
    }
    .header-container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
    }
    .header-img {
        width: 100px;
        height: auto;
    }
    h1 {
        font-family: 'Times New Roman';
        font-size: 24px;
        font-weight: bold;
        color: #ffffff;
        text-align: center;
        text-transform: uppercase;
    }
    h2{
        font-size: 20px;
        font-weight: bold;
        color: #000000;
        text-align: center;
        text-transform: uppercase;
    }

     .menu{
            background-color: rgba(255, 255, 255, 0.9);
            text-align: right;
            padding: 8px 20px;
        }

.home {
        background-color: #cb0b0b;
        color: white;
        text-decoration: none;
        padding: 8px 14px;
        border-radius: 6px;
        font-size: 14px;
        transition: background-color 0.3s;
    }

    .home:hover {
        background-color: #813131;
    }

    .hoome {
        background-color: #073948;
        color: white;
        text-decoration: none;
        padding: 8px 14px;
        border-radius: 6px;
        font-size: 14px;
        transition: background-color 0.3s;
    }

    .hoome:hover {
        background-color: #127d9a;
    }

    footer {
        background-color: #01414c;
        color: white;
        text-align: center;
        padding: 10px;
    }

    form {
        background-color: #769ca3;
        color: black;
        padding: 30px;
        border-radius: 10px;
        width: 350px;
        margin: auto;
        box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.7);
    }
    input, button {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border: none;
        border-radius: 5px;
    }
    button {
        background-color: #073948;
        color: white;
        cursor: pointer;
        transition: background-color 0.3s;
    }
    button:hover {
        background-color: #346761;
    }
</style>
</head>
<body>
<header>
    <div class="header-container">
        <h1>CRIME REPORTING SYSTEM</h1>
        <img src="/images/logo.jpg" alt="Logo" class="header-img">
    </div>
</header>

<div class="menu">
    <!-- Reg -->
    <a th:href="@{/register/user}" class="hoome" >Register as User</a>
    <a th:href="@{/register/police}" class="hoome" >Register as Police</a>
    <a th:href="@{/register/admin}" class="hoome" >Register as Admin</a>

    <a th:href="@{/}" class="home">Home</a>
</div>

<br>

<div style="display: flex; justify-content: flex-end; padding: 100px;">

    <div th:if="${successMessage}" class="alert alert-success">
        <p th:text="${successMessage}"></p>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger">
        <p th:text="${errorMessage}"></p>
    </div>

    <form
            th:action="@{/login}" method="post">
        <h2>LOGIN</h2>
        <input type="text" name="username" placeholder="Email"/><br>
        <input type="password" name="password" placeholder="Password"/><br>
        <button type="submit">Login</button>
    </form>
</div>
