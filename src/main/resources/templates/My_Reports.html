<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Reports</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f8fb;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #01414c;
            color: white;
            padding: 15px;
            text-align: center;
        }
        .container {
            max-width: 900px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h2 {
            color: #01414c;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            background-color: #01414c;
            color: white;
            padding: 10px;
        }
        td {
            padding: 8px;
            text-align: center;
            border: 1px solid #ccc;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            background-color: #1c4a53;
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
            text-decoration: none;
        }
        .back-link:hover {
            background-color: #127d9a;
        }
        footer {
            background-color: #01414c;
            color: white;
            text-align: center;
            padding: 12px 0;
            font-size: 14px;
            margin-top: 40px;
        }
    </style>
</head>
<body>

<header>
    <h1>My Reported Crimes</h1>
</header>

<div class="container">
    <h2>Crime Records</h2>
    <table>
        <thead>
        <tr>
            <th>Crime ID</th>

        </tr>
        </thead>
        <tbody>
        <tr th:each="report : ${myReports}">
<!--            <td th:text="${report.id}"></td>-->
<!--            <td th:text="${report.title}"></td>-->
            <td>
                <a th:href="@{/report/reports/{id}(id=${report.id})}"
                   th:text="${report.title}"
                   class="title-link">
                </a>
            </td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/user/dashboard}" class="back-link">← Back to Dashboard</a>
</div>

<footer>
    &copy; 2025 Samiha. All rights reserved.| User Portal
</footer>

</body>
</html>
